name: Payment API CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    # Environment variables available to all steps in this job
    
    env:
      API_KEY: ${{ secrets.API_KEY }}
      API_BASE_URL: http://127.0.0.1:8000
      DB_HOST: 127.0.0.1
      DB_NAME: payment_systemdb
      DB_USER: payuser
      DB_PASS: paypass

    # Services required by the job
    services:
      mysql:
        image: mysql:8.0
        env:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: payment_test
            MYSQL_USER: payuser
            MYSQL_PASSWORD: paypass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Generate .env file for PHP
        run:  |
          cat <<EOF > .env
          API_KEY=${{ secrets.API_KEY }}
          DB_HOST=127.0.0.1
          DB_NAME=payment_test
          DB_USER=root
          DB_PASS=root
          EOF
      - name: Start API
        run: |
          php -S 127.0.0.1:8000 -t public > server.log 2>&1 &
      - name: Wait for API to be ready
        run: |
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/v1/ping > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 1
          done
          echo "API did not start in time"
          exit 1
      - name: Show server log
        if: failure()
        run: |
          echo "===== PHP SERVER LOG ====="
          cat server.log || true
      - name: Export API key for pytest
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV
      - name: Run tests
        run: |
          pytest tests/test_auth.py -x
