name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & push image
        run: |
            docker build -t 192.168.8.246:3000/alihasanashoor/payment-api:latest .
            docker push 192.168.8.246:3000/alihasanashoor/payment-api:latest
            

