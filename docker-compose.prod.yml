version: "3.9"

services:
  api:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_api_prod
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      prod-db:
        condition: service_healthy # wait untill DB healthcheck passess
    networks:
      - payment-net


  prod-db: 
    image: mysql:8.0
    container_name: payment_mysql_prod
    restart: always
    environment:
      MYSQL_DATABASE: payment_prod
      MYSQL_USER: payuser
      MYSQL_PASSWORD: paypass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./database/prod-schema.sql:/docker-entrypoint-initdb.d/prod_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s # run every 5 seconds
      timeout: 5s # if it takes more then 5 seconds it is considered failed
      retries: 10 # allow 10 consecutive failures before marking container as UNHEALTHY

    networks:
      - payment-net

volumes:
  mysql_prod_data:

networks:
  payment-net:
    external: true