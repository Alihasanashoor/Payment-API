version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db
    networks:
      - payment-net
  

  db: 
    image: mysql:8.0
    container_name: payment_mysql
    restart: always
    environment:
      MYSQL_DATABASE: payment_test
      MYSQL_USER: payuser
      MYSQL_PASSWORD: paypass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
     - "3306:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - payment-net

  prod-db: 
    image: mysql:8.0
    container_name: payment_mysql_prod
    restart: always
    environment:
      MYSQL_DATABASE: payment_prod
      MYSQL_USER: payuser
      MYSQL_PASSWORD: paypass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - payment-net
volumes:
  mysql_test_data:
  mysql_prod_data:

networks:
  payment-net:
    external: true