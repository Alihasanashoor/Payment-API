version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db

  


  db: 
    image: mysql:8.0
    container_name: payment_mysql
    restart: always
    environment:
      MYSQL_DATABASE: payment_test
      MYSQL_USER: payuser
      MYSQL_PASSWORD: paypass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  mysql_data: